<div class="stepsevaluation-container">
  <!-- 1. Stepper tipo cápsula centrado en la parte superior -->
  <header class="stepsevaluation-header">
    <app-stepper-tabs
      [steps]="steps()"
      [currentStep]="currentStep()"
      (stepChange)="onStepChange($event)"
    />
  </header>

  <!-- 2. Contenido del paso activo -->
  <main class="stepsevaluation-body">
    <ng-container [ngSwitch]="currentStep()">
      <!-- Paso 1: DATOS GENERALES DEL PROYECTO -->
      <app-step-datos-generales
        *ngSwitchCase="'datos-generales'"
        [datos]="datosGenerales()"
        (datosChange)="onDatosChange($event)"
      />

      <!-- Paso 2: EXPEDIENTE -->
      <app-step-expediente
        *ngSwitchCase="'expediente'"
        [documentos]="documentosExpediente()"
        [codigoExpediente]="codigoExpediente()"
        (verDocumento)="onVerDocumento($event)"
      />

      <!-- Paso 3: ANEXO / CUMPLIMIENTO DE PRINCIPIOS ÉTICOS (CON BARRA VERTICAL) -->
      <app-step-anexo
        *ngSwitchCase="'anexo'"
        [criterios]="criteriosEticos()"
        [etapas]="etapasProgresoVertical()"
        (criteriosChange)="onCriteriosChange($event)"
        (cancelar)="onCancelar()"
        (continuar)="onContinuar()"
      />
    </ng-container>
  </main>
</div>
