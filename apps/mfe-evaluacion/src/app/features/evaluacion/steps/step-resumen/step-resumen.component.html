<div class="eval-resumen-layout">
  <!-- Título principal -->
  <h1 class="eval-resumen-title">Resumen</h1>

  <!-- VISTA DE EVALUACIÓN FINALIZADA (Muestra confirmación durante 5s y redirige a homeview2) -->
  <app-step-evaluacion-finalizada
    *ngIf="evaluacionEnviada"
    [codigoExpediente]="codigoExpediente()"
    (tiempoAgotado)="onRedireccionarHome()"
  />

  <!-- Contenedor de 2 columnas: Selector Izquierdo y Tarjeta Derecha -->
  <div *ngIf="!evaluacionEnviada" class="eval-resumen-body">
    <!-- COLUMNA IZQUIERDA: Píldoras de Selección de Expediente y Anexo -->
    <aside class="eval-resumen-sidebar" aria-label="Navegación de Resumen">
      <!-- 1. Bloque Expediente -->
      <div class="eval-resumen-nav-group">
        <div class="eval-resumen-nav-badge">
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="eval-resumen-nav-icon"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" fill="#FFEAA7" stroke="#1A1A1A" />
            <path d="M3 7l9 6 9-6" stroke="#1A1A1A" />
          </svg>
          <span class="eval-resumen-nav-badge-text">Expediente</span>
        </div>
        <button
          type="button"
          class="eval-resumen-pill-btn"
          [class.active]="subVista() === 'expediente'"
          (click)="onSelectVista('expediente')"
        >
          {{ codigoExpediente() }}
        </button>
      </div>

      <!-- 2. Bloque Evaluar Expediente (Anexo N°9) -->
      <div class="eval-resumen-nav-group">
        <div class="eval-resumen-nav-badge">
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="eval-resumen-nav-icon"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" fill="#FFEAA7" stroke="#1A1A1A" />
            <path d="M3 7l9 6 9-6" stroke="#1A1A1A" />
          </svg>
          <span class="eval-resumen-nav-badge-text">Evaluar Expediente</span>
        </div>
        <button
          type="button"
          class="eval-resumen-pill-btn"
          [class.active]="subVista() === 'anexo'"
          (click)="onSelectVista('anexo')"
        >
          ANEXO N°9
        </button>
      </div>
    </aside>

    <!-- COLUMNA DERECHA: Tarjeta Central de Documentos o Formato Anexo N°9 -->
    <main class="eval-resumen-content">
      <!-- TARJETA 1: Documentos del Expediente (Vista activa: expediente) -->
      <section *ngIf="subVista() === 'expediente'" class="eval-resumen-card">
        <!-- Cabecera de la tarjeta con título -->
        <div class="eval-resumen-card-header">
          <h2 class="eval-resumen-card-title">Documentos del expediente</h2>
        </div>

        <!-- Línea divisoria superior -->
        <div class="eval-resumen-card-divider"></div>

        <!-- Lista de documentos con menú desplegable en Editar -->
        <ul class="eval-resumen-doc-list">
          <!-- 1 a 4: Documentos regulares del expediente -->
          <ng-container *ngFor="let doc of documentos()">
            <li *ngIf="doc.id !== 'anexo'" class="eval-resumen-doc-item">
              <span class="eval-resumen-doc-name">{{ doc.nombre }}</span>

              <!-- Botón Editar con menú desplegable -->
              <div class="eval-resumen-doc-action-wrapper">
                <button
                  type="button"
                  class="eval-resumen-doc-action"
                  (click)="toggleMenuDoc(doc.id, $event)"
                  [attr.aria-expanded]="menuAbiertoDocId() === doc.id"
                >
                  <span>Editar</span>
                  <svg
                    viewBox="0 0 20 20"
                    width="13"
                    height="13"
                    fill="currentColor"
                    class="eval-resumen-chevron-icon"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </button>

                <!-- Menú desplegable emergente con Ver y Actualizar -->
                <div
                  *ngIf="menuAbiertoDocId() === doc.id"
                  class="eval-resumen-dropdown-menu"
                  (click)="$event.stopPropagation()"
                >
                  <button
                    type="button"
                    class="eval-resumen-dropdown-item"
                    (click)="onVerDoc(doc, $event)"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      width="15"
                      height="15"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <span>Ver</span>
                  </button>
                  <button
                    type="button"
                    class="eval-resumen-dropdown-item"
                    (click)="onActualizarDoc(doc, $event)"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      width="15"
                      height="15"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
                    </svg>
                    <span>Actualizar</span>
                  </button>
                </div>
              </div>
            </li>
          </ng-container>

          <!-- 5. Reemplazo del Anexo por el Checkbox NTE y Declaración Jurada -->
          <li class="eval-resumen-doc-item--nte-anexo">
            <div class="nte-declaration-card">
              <div class="nte-declaration-card-header">
                <span class="nte-declaration-header-title">Anexo N°9 — Declaración Jurada</span>
                <span class="nte-declaration-badge">Requerido</span>
              </div>
              <label class="nte-declaration-row">
                <input
                  type="checkbox"
                  class="nte-checkbox"
                  [checked]="declaracionNoIa()"
                  (change)="onToggleDeclaracion($event)"
                />
                <span class="nte-declaration-text">
                  {{ textoDeclaracion }}
                </span>
              </label>
            </div>
          </li>
        </ul>
      </section>

      <!-- TARJETA 2: Declaración Jurada y Ética (Vista activa: anexo en resumen) -->
      <section *ngIf="subVista() === 'anexo'" class="eval-resumen-card nte-resumen-card">
        <div class="nte-resumen-header">
          <h2 class="nte-resumen-title">
            <span>Declaración Jurada y Ética del Evaluador</span>
            <span class="nte-declaration-badge">Requerido</span>
          </h2>
          <p class="nte-resumen-subtitle">
            Por favor, confirme la declaración de originalidad y autoría intelectual antes de finalizar el expediente.
          </p>
        </div>

        <div class="eval-resumen-card-divider" style="border-color: #3b3e46;"></div>

        <div class="nte-declaration-card">
          <label class="nte-declaration-row">
            <input
              type="checkbox"
              class="nte-checkbox"
              [checked]="declaracionNoIa()"
              (change)="onToggleDeclaracion($event)"
            />
            <span class="nte-declaration-text">
              {{ textoDeclaracion }}
            </span>
          </label>
        </div>
      </section>

      <!-- Botonera Inferior con botones y acciones NTE -->
      <footer class="nte-actions">
        <button
          type="button"
          class="nte-btn cancel"
          (click)="onAnterior()"
        >
          Anterior
        </button>
        <button
          type="button"
          class="nte-btn confirm"
          [disabled]="!declaracionNoIa()"
          (click)="onCompletar()"
        >
          Confirmar
        </button>
      </footer>
    </main>
  </div>
</div>
