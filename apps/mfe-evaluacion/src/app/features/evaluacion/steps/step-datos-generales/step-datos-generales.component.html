<div class="datos-generales-container">
  <div *ngFor="let campo of campos" class="dato-row-card">
    <span class="dato-label">{{ campo.label }}</span>
    <div class="dato-badge-capsule" [title]="datos[campo.id]">
      <span class="dato-badge-text">{{ datos[campo.id] }}</span>
    </div>
  </div>

  <!-- Botonera Inferior: Cancelar (Salir a homeview2) y Continuar -->
  <footer class="eval-actions-footer" style="margin-top: 2rem;">
    <button
      type="button"
      class="eval-btn-pill"
      (click)="onCancelar()"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="eval-btn-pill eval-btn-pill--primary"
      (click)="onContinuar()"
    >
      Continuar
    </button>
  </footer>
</div>
